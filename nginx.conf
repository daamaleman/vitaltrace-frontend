# ============================================================
# VitalTrace - App Web | Nginx (dentro del contenedor)
#   - Sirve la SPA de Vue con fallback a index.html
#   - Compresión gzip de los estáticos
#   - Proxy inverso de /api hacia el backend (opcional)
#   - Cabeceras básicas de seguridad y caché de activos
# ============================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Compresión gzip (app comprimida al cliente) ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Caché larga para activos con hash (Vite) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Proxy inverso hacia la API (opcional) ----
    # La app actual llama directo a https://api.vitaltrace.lat, pero se deja
    # listo: si algún día la app usa /api, Nginx lo reenvía al backend.
    location /api/ {
        proxy_pass              https://api.vitaltrace.lat;
        proxy_set_header        Host api.vitaltrace.lat;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_ssl_server_name   on;
    }

    # ---- SPA: todo lo demás cae en index.html (Vue Router) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Cabeceras básicas de seguridad ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- No cachear el index.html (para que tome nuevos deploys) ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
